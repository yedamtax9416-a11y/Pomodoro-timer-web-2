<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <main class="timer-card">
    <h1>Pomodoro</h1>

    <p class="mode-label">집중 시간</p>

    <div id="time-display" class="time-display">25:00</div>

    <div class="controls">
      <button type="button" class="btn btn-primary" onclick="startTimer()">시작</button>
      <button type="button" class="btn btn-secondary">정지</button>
      <button type="button" class="btn btn-secondary" onclick="resetTimer()">초기화</button>
    </div>

    <button type="button" class="settings-btn" onclick="location.href='setting.html'">⚙ 설정</button>
  </main>

  <script src="index.js"></script>
</body>
</html>
